<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student ID Card Generator - APAA</title>

  <!-- External Libraries -->
  <!-- html2canvas library for rendering/downloading card image -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- SheetJS library for parsing Excel files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      max-width: 800px;
      width: 100%;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      color: #0b2545;
      font-size: 24px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-weight: 600;
      font-size: 14px;
      color: #444;
    }

    input[type="file"], select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background-color: #0056b3;
      color: #fff;
    }

    .btn-primary:hover {
      background-color: #004085;
    }

    .card-preview-container {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .id-card {
      position: relative;
      width: 350px;
      height: 550px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .card-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .card-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 120px;
    }

    .photo-frame {
      width: 120px;
      height: 140px;
      border: 2px solid #0056b3;
      border-radius: 6px;
      overflow: hidden;
      background: #e9ecef;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-placeholder {
      color: #888;
      font-size: 14px;
    }

    .student-details {
      margin-top: 20px;
      text-align: center;
      width: 85%;
    }

    .student-details h2 {
      font-size: 18px;
      color: #0b2545;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .detail-row {
      font-size: 13px;
      margin: 5px 0;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Student ID Card Generator</h1>
    <p class="subtitle">Alagappa Performing Arts Academy</p>

    <div class="controls">
      <div class="input-group">
        <label for="excelFile">Upload Excel Data Sheet (.xlsx / .csv):</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" />
      </div>

      <div class="input-group">
        <label for="studentSelect">Select Student:</label>
        <select id="studentSelect" disabled>
          <option value="">-- Upload Excel file first --</option>
        </select>
      </div>

      <div class="input-group">
        <label for="photoUpload">Upload Student Photo:</label>
        <input type="file" id="photoUpload" accept="image/*" />
      </div>

      <div class="button-group">
        <button id="downloadPngBtn" class="btn btn-primary">Download PNG</button>
      </div>
    </div>

    <!-- ID Card Preview Area -->
    <div class="card-preview-container">
      <div id="idCard" class="id-card">
        <img src="card-bg.png" alt="ID Card Background" class="card-bg" />
        
        <div class="card-content">
          <div class="photo-frame">
            <img id="cardStudentPhoto" src="" alt="Student Photo" style="display: none;" />
            <div id="photoPlaceholder" class="photo-placeholder">Photo</div>
          </div>

          <div class="student-details">
            <h2 id="cardStudentName">STUDENT NAME</h2>
            <p class="detail-row"><strong>ID No:</strong> <span id="cardStudentId">---</span></p>
            <p class="detail-row"><strong>Course:</strong> <span id="cardCourse">---</span></p>
            <p class="detail-row"><strong>Batch:</strong> <span id="cardBatch">---</span></p>
            <p class="detail-row"><strong>Contact:</strong> <span id="cardContact">---</span></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let studentData = [];

      const excelFileInput = document.getElementById('excelFile');
      const studentSelect = document.getElementById('studentSelect');
      const photoUploadInput = document.getElementById('photoUpload');
      const downloadPngBtn = document.getElementById('downloadPngBtn');

      // Elements on ID card
      const cardStudentName = document.getElementById('cardStudentName');
      const cardStudentId = document.getElementById('cardStudentId');
      const cardCourse = document.getElementById('cardCourse');
      const cardBatch = document.getElementById('cardBatch');
      const cardContact = document.getElementById('cardContact');
      const cardStudentPhoto = document.getElementById('cardStudentPhoto');
      const photoPlaceholder = document.getElementById('photoPlaceholder');

      // Handle Excel File Upload
      excelFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];

          studentData = XLSX.utils.sheet_to_json(worksheet);

          if (studentData.length > 0) {
            populateStudentDropdown(studentData);
          } else {
            alert('No data found in the uploaded file.');
          }
        };
        reader.readAsArrayBuffer(file);
      });

      // Populate Dropdown Menu
      function populateStudentDropdown(data) {
        studentSelect.innerHTML = '<option value="">-- Select a Student --</option>';
        data.forEach((student, index) => {
          const name = student.Name || student.StudentName || `Student ${index + 1}`;
          const option = document.createElement('option');
          option.value = index;
          option.textContent = `${name} (${student.ID || student.StudentID || index + 1})`;
          studentSelect.appendChild(option);
        });
        studentSelect.disabled = false;
      }

      // Update Card when Student is Selected
      studentSelect.addEventListener('change', () => {
        const selectedIndex = studentSelect.value;
        if (selectedIndex === '') return;

        const student = studentData[selectedIndex];
        cardStudentName.textContent = student.Name || student.StudentName || 'N/A';
        cardStudentId.textContent = student.ID || student.StudentID || 'N/A';
        cardCourse.textContent = student.Course || student.Program || 'N/A';
        cardBatch.textContent = student.Batch || student.Year || 'N/A';
        cardContact.textContent = student.Contact || student.Phone || 'N/A';
      });

      // Handle Photo Upload
      photoUploadInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          cardStudentPhoto.src = evt.target.result;
          cardStudentPhoto.style.display = 'block';
          photoPlaceholder.style.display = 'none';
        };
        reader.readAsDataURL(file);
      });

      // Download ID Card as PNG Image
      downloadPngBtn.addEventListener('click', () => {
        const cardElement = document.getElementById('idCard');
        html2canvas(cardElement, { scale: 2, useCORS: true }).then((canvas) => {
          const link = document.createElement('a');
          const studentName = cardStudentName.textContent.trim().replace(/\s+/g, '_');
          link.download = `ID_Card_${studentName || 'Student'}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        });
      });
    });
  </script>
</body>
</html>
